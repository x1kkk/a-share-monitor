# Complete nginx.conf for the Hong Kong frontend host.
# Replace example domain, TLS paths, root and mainland PRIVATE/VPN backend IP.
worker_processes auto;
error_log /var/log/nginx/market-error.log warn;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream mainland_backend {
        server 10.0.0.10:8000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name monitor.example.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name monitor.example.com;
        ssl_certificate /etc/letsencrypt/live/monitor.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/monitor.example.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        root /var/www/market-monitor/frontend/dist;
        index index.html;
        client_max_body_size 64k;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;

        location = /ws {
            proxy_pass http://mainland_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 5s;
            proxy_buffering off;
            proxy_cache off;
        }

        location /api/ {
            proxy_pass http://mainland_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            proxy_cache off;
        }

        location = /health {
            proxy_pass http://mainland_backend;
            proxy_set_header Host $proxy_host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
        }

        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff always;
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
