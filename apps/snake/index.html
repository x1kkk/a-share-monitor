<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101b1b">
  <meta name="description" content="打开即玩的贪吃蛇，支持键盘、触屏和本地最高分。">
  <title>贪吃蛇 · SNAKE CLUB</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="arcade">
    <header class="header">
      <a class="brand" href="./" aria-label="贪吃蛇首页"><span class="brand-icon" aria-hidden="true">▦</span> SNAKE CLUB</a>
      <span class="edition">经典游戏 / 随时来一局</span>
    </header>
    <div class="layout">
      <section class="sidebar" aria-label="游戏设置和分数">
        <p class="eyebrow">JUST ONE MORE BITE.</p>
        <h1>贪吃蛇<span>小心，会上瘾。</span></h1>
        <p class="intro">吃掉果实，不断长大。<br>在下一次转弯前，想好方向。</p>
        <div class="scores">
          <div><span class="label">本局得分</span><strong id="score">000</strong></div>
          <div><span class="label">个人纪录</span><strong id="best">000</strong></div>
        </div>
        <label class="label" for="difficulty">游戏速度</label>
        <select id="difficulty">
          <option value="easy">悠闲 · 慢慢来</option>
          <option value="normal" selected>经典 · 刚刚好</option>
          <option value="fast">极速 · 挑战反应</option>
        </select>
        <div class="actions">
          <button id="primary" class="primary" type="button">开始游戏</button>
          <button id="restart" class="secondary" type="button">重新开始</button>
        </div>
        <p id="status" role="status" aria-live="polite">准备好了，随时开始。</p>
        <div class="instructions">
          <span class="label">操作指南</span>
          <p><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 或 WASD 移动</p>
          <p><kbd>Space</kbd> 暂停 / 继续</p>
          <p class="touch-note">手机可滑动棋盘，或使用下方方向键。</p>
        </div>
      </section>
      <section class="play-area" aria-label="贪吃蛇游戏">
        <div class="board-heading"><span><i class="indicator"></i><span id="phase">待机中</span></span><span id="length">长度 4</span></div>
        <div class="board" id="board">
          <canvas id="canvas" width="720" height="720" role="img" aria-label="24 乘 24 格贪吃蛇棋盘，使用方向键或 WASD 操作"></canvas>
          <div id="overlay" class="overlay">
            <div class="overlay-card"><span class="mini-label">READY TO PLAY?</span><h2 id="overlay-title">下一口，吃哪里？</h2><p id="overlay-copy">按空格键，或点击按钮开始。</p><button id="overlay-button" class="primary" type="button">开始游戏</button></div>
          </div>
        </div>
        <div class="board-footer"><span><i class="food-dot"></i> 每颗果实 +10 分</span><span>撞墙或碰到自己，游戏结束</span></div>
        <div class="dpad" aria-label="触屏方向键">
          <button class="up" data-direction="up" type="button" aria-label="向上">↑</button>
          <button class="left" data-direction="left" type="button" aria-label="向左">←</button>
          <button class="down" data-direction="down" type="button" aria-label="向下">↓</button>
          <button class="right" data-direction="right" type="button" aria-label="向右">→</button>
        </div>
      </section>
    </div>
    <footer class="footer"><span>少一点分心，多一点开心。</span><span>NO DOWNLOAD. JUST PLAY.</span></footer>
  </main>
  <script type="module" src="app.mjs"></script>
</body>
</html>
